name = "corsteno-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"

[vars]
ENVIRONMENT = "production"
APP_VERSION = "0.0.1"
WEB_ORIGINS = "https://crm.corsteno.com,https://cosquinrock.corsteno.com"
PUBLIC_ORIGINS = "https://corsteno-runtime.matiasgerstner.workers.dev,https://corsteno.com"
TREASURE_HUNT_ADMIN_API_URL = "https://corsteno-treasure-hunt.matiasgerstner.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "corsteno-db"
database_id = "e028adf0-ed6c-4e20-b74d-59b94910639f"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "EXPERIENCE_ASSETS"
bucket_name = "corsteno-experience-assets"

[[queues.producers]]
binding = "LEAD_JOB_QUEUE"
queue = "corsteno-lead-jobs"

[[queues.producers]]
binding = "FINDER_JOB_QUEUE"
queue = "corsteno-finder-jobs"

[[queues.consumers]]
queue = "corsteno-lead-jobs"
max_batch_size = 5
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3
dead_letter_queue = "corsteno-lead-jobs-dlq"

[env.development.vars]
ENVIRONMENT = "development"
APP_VERSION = "0.0.1-dev"
WEB_ORIGINS = "https://crm.corsteno.com,https://cosquinrock.corsteno.com"
PUBLIC_ORIGINS = "https://corsteno-runtime.matiasgerstner.workers.dev,https://corsteno.com"

[[env.development.d1_databases]]
binding = "DB"
database_name = "corsteno-db"
database_id = "e028adf0-ed6c-4e20-b74d-59b94910639f"
migrations_dir = "src/db/migrations"

[[env.development.r2_buckets]]
binding = "EXPERIENCE_ASSETS"
bucket_name = "corsteno-experience-assets"

# Development queues are intentionally explicit and isolated from production.
# LEAD_JOB_QUEUE is consumed by this Worker; FINDER_JOB_QUEUE is consumed by
# the external Finder runner through Cloudflare Queues HTTP pull.
[[env.development.queues.producers]]
binding = "LEAD_JOB_QUEUE"
queue = "corsteno-lead-jobs-development"

[[env.development.queues.producers]]
binding = "FINDER_JOB_QUEUE"
queue = "corsteno-finder-jobs-development"

[[env.development.queues.consumers]]
queue = "corsteno-lead-jobs-development"
max_batch_size = 5
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3
dead_letter_queue = "corsteno-lead-jobs-development-dlq"
